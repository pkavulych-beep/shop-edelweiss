# Local PostgreSQL for development, tests and agents.
# Start: docker compose up -d db
# Credentials match internet_shop-back-/.env.example (development only).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: Edelweiss
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d Edelweiss"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
